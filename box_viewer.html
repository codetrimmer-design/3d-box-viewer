<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Box Viewer - 3mm x 3mm x 6mm</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; overflow: hidden; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
            z-index: 100;
        }
        #info h1 { font-size: 20px; margin-bottom: 10px; }
        #info p { font-size: 14px; color: #aaa; }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 100;
        }
        button {
            background: #444;
            color: #fff;
            border: none;
            padding: 8px 16px;
            margin: 0 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #666; }
    </style>
</head>
<body>
    <div id="info">
        <h1>3D Box Model</h1>
        <p>Dimensions: 3mm × 3mm × 6mm</p>
        <p>Use mouse to rotate, scroll to zoom</p>
    </div>
    <div id="controls">
        <button onclick="resetView()">Reset View</button>
        <button onclick="toggleWireframe()">Wireframe</button>
        <button onclick="toggleEdges()">Toggle Edges</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        // Camera
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 8, 12);
        camera.lookAt(0, 0, 0);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight1.position.set(10, 10, 10);
        scene.add(directionalLight1);

        const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
        directionalLight2.position.set(-5, 5, -5);
        scene.add(directionalLight2);

        // Create box geometry (3mm x 3mm x 6mm)
        const geometry = new THREE.BoxGeometry(3, 6, 3);
        const material = new THREE.MeshPhongMaterial({
            color: 0x00aaff,
            shininess: 100,
            specular: 0x444444
        });
        const box = new THREE.Mesh(geometry, material);
        scene.add(box);

        // Edges
        const edgesGeometry = new THREE.EdgesGeometry(geometry);
        const edgesMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
        const edges = new THREE.LineSegments(edgesGeometry, edgesMaterial);
        box.add(edges);

        // Grid helper
        const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x333333);
        scene.add(gridHelper);

        // Axes helper
        const axesHelper = new THREE.AxesHelper(5);
        scene.add(axesHelper);

        // Labels
        function createLabel(text, position, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, 128, 64);
            ctx.fillStyle = color || '#fff';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(text, 64, 40);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.position.copy(position);
            sprite.scale.set(2, 1, 1);
            return sprite;
        }

        // Dimension labels
        const labelX = createLabel('3mm', new THREE.Vector3(2, -1, 0), '#ff4444');
        const labelY = createLabel('6mm', new THREE.Vector3(-1, 4, 0), '#44ff44');
        const labelZ = createLabel('3mm', new THREE.Vector3(0, -1, 2), '#4444ff');
        scene.add(labelX, labelY, labelZ);

        // State
        let wireframe = false;
        let showEdges = true;

        // Functions
        function resetView() {
            camera.position.set(10, 8, 12);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        function toggleWireframe() {
            wireframe = !wireframe;
            material.wireframe = wireframe;
        }

        function toggleEdges() {
            showEdges = !showEdges;
            edges.visible = showEdges;
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
